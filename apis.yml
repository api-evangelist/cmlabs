description: CMLabs (千麦医疗 / Qianmai Medical) is an independent third-party clinical
  laboratory group headquartered in China. It operates a network of medical testing
  laboratories that provide clinical laboratory diagnostics, pathology diagnosis, routine
  and specialty blood testing, clinical trial and research testing, and laboratory
  information system (LIS) services to hospitals, clinics, and other medical institutions.
  The company is a portfolio company of Qiming Venture Partners. It does not currently
  publish a public developer API, documentation, or SDK surface.
